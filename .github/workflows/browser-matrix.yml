name: Cross-Browser Compatibility Matrix

on:
  push:
    branches: [main]
    paths:
      - 'selenium-lab/config/**'
      - 'selenium-lab/drivers/**'
      - 'experiments/browser_compatibility/**'
      - '.github/workflows/browser-matrix.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cross-browser-matrix:
    name: Matrix Test - ${{ matrix.browser }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv package manager
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Set up Chrome browser
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up Firefox browser
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Run Smoke Tests on ${{ matrix.browser }}
        run: uv run pytest selenium-lab/tests/test_smoke_foundation.py -v --browser ${{ matrix.browser }} --headless

      - name: Run Browser Compatibility Experiments on ${{ matrix.browser }}
        run: uv run pytest experiments/browser_compatibility/test_exp14_browser_compatibility.py -v --browser ${{ matrix.browser }} --headless --continue-on-collection-errors

      - name: Upload Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-${{ matrix.browser }}-artifacts
          path: artifacts/
          retention-days: 7
