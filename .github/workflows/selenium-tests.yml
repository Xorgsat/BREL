name: Selenium Reliability Suite

on:
  push:
    branches: [main]
    paths:
      - 'selenium-lab/**'
      - 'experiments/**'
      - 'controlled-app/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/selenium-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selenium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium-tests:
    name: Selenium WebDriver Tests (Chrome Headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv package manager
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Set up Chrome browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Selenium Smoke Suite
        run: |
          source .venv/bin/activate
          pytest selenium-lab/tests/test_smoke_foundation.py -v --headless

      - name: Run Full Reliability Experiment Suite (Parallel)
        run: |
          source .venv/bin/activate
          pytest experiments/ -n 2 -v --headless

      - name: Upload Failure Diagnostics & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-artifacts
          path: |
            artifacts/
            reports/
          retention-days: 14
