[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-reliability-engineering-lab"
version = "0.1.0"
description = "Browser Reliability Engineering Lab (BREL) - Advanced Browser Automation & Flakiness Research"
authors = [
    { name = "Senior SDET / Reliability Engineering Specialist" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.20.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "experiments",
    "selenium-lab",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: Quick validation tests for framework and environment health",
    "experiment: Reliability lab experiments",
    "flaky_repro: Controlled flaky test reproduction scenarios",
    "public_app: Tests requiring access to external demo applications",
    "controlled_app: Tests executed against deterministic local controlled application",
    "slow: Tests with intentional long delays or high iteration counts",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
