[pytest]
minversion = 8.0
addopts = -ra -q --strict-markers
testpaths = experiments selenium-lab
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick validation tests for framework and environment health
    experiment: Reliability lab experiments
    flaky_repro: Controlled flaky test reproduction scenarios
    public_app: Tests requiring access to external demo applications
    controlled_app: Tests executed against deterministic local controlled application
    slow: Tests with intentional long delays or high iteration counts
    network_sensitive: Tests that communicate with external services and are sensitive to parallel load; run sequentially where possible
    flaky_candidate: Tests that exhibit non-deterministic failures under load; documented as known flakiness evidence
filterwarnings =
    ignore::DeprecationWarning
